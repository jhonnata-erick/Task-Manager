name: TaskManager CI Pipeline

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Checar Tipos
        run: npm run tscheck

      - name: Executar o lint
        run: npm run lint

      #- name: Executar Testes
      #  run: npm run test --if-present

      - name: Executar Build # Pra ver se não tem erro de compilação
        run: npx vite build
